name: Archive Script Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Syntax gate
      run: python -m py_compile scripts/archive_cold_storage.py
    - name: Install test dependencies
      run: pip install pytest pymysql pandas pyarrow python-dateutil
    - name: Run tests
      run: python -m pytest scripts/tests/ -v
